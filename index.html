<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LUXE — أرقى الأزياء الفاخرة في الجزائر. تسوّق أحدث صيحات الموضة العصرية بجودة عالمية وشحن سريع لكل الولايات.">
  <meta name="theme-color" content="#07000f">
  <meta property="og:title" content="LUXE — أزياء فاخرة">
  <meta property="og:description" content="اكتشف أرقى الأزياء الفاخرة في الجزائر">
  <meta property="og:type" content="website">

  <title>LUXE — أزياء فاخرة</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Fonts: Preconnect + Load -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <!-- Announcement Bar -->
  <div id="announcementBar"></div>

  <!-- Header -->
  <header id="siteHeader"></header>

  <!-- Main App Container -->
  <main id="app">
    <!-- Preloader -->
    <div class="preloader" id="preloader">
      <div class="preloader__logo">
        <span class="preloader__letter">L</span>
        <span class="preloader__letter">U</span>
        <span class="preloader__letter">X</span>
        <span class="preloader__letter">E</span>
      </div>
      <div class="preloader__bar">
        <div class="preloader__progress"></div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer id="siteFooter"></footer>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Modal Container -->
  <div id="modalOverlay" class="modal-overlay" aria-hidden="true"></div>

  <!-- Drawer Container -->
  <div id="drawerOverlay" class="drawer-overlay" aria-hidden="true"></div>

  <!-- App Entry -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
