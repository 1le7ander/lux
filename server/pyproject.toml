[project]
name = "luxe-backend"
version = "1.0.0"
description = "LUXE luxury fashion e-commerce backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0,<4.1.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
start = "uvicorn main:app --host 0.0.0.0 --port 8080"
